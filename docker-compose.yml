version: '3.8'
services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: gighub-postgres
    environment:
      - POSTGRES_DB=GigHubDB
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-GighubAdmin123!}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - gighub-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d GigHubDB"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
  
  # Python Flask ML API
  flask-ml-api:
    build:
      context: .
      dockerfile: Dockerfile.flask
    container_name: gighub-flask-api
    environment:
      - FLASK_ENV=production
    ports:
      - "5000:5000"
    volumes:
      - ./wwwroot/models:/app:ro
    networks:
      - gighub-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
  
  # ASP.NET Core Application
  gighub-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gighub-app
    environment:
      # Database configuration
      - CONNECTION_STRING=Host=postgres;Port=5432;Database=GigHubDB;Username=postgres;Password=${POSTGRES_PASSWORD:-GighubAdmin123!};SSL Mode=Prefer;Trust Server Certificate=true;
      
      # Encryption
      - ENCRYPTION_MASTER_KEY=${ENCRYPTION_MASTER_KEY}
      
      # Email configuration
      - RESEND_API_KEY=${RESEND_API_KEY}
      - FROM_EMAIL=${FROM_EMAIL}
      
      # Azure ML (optional)
      - AZURE_ML_ENDPOINT=${AZURE_ML_ENDPOINT}
      - AZURE_ML_API_KEY=${AZURE_ML_API_KEY}
      - AZURE_SUBSCRIPTION_ID=${AZURE_SUBSCRIPTION_ID}
      
      # ASP.NET Core settings
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=https://+:8080;http://+:8081
      - ASPNETCORE_Kestrel__Certificates__Default__Password=GighubAdmin123!
      - ASPNETCORE_Kestrel__Certificates__Default__Path=/https/aspnetapp.pfx
      - DOTNET_RUNNING_IN_CONTAINER=true
      - DISABLE_HTTPS_REQUIREMENT=true
      - Admin__Email=admin@gighub.com
      - Admin__Password=AdminGighub@1
      - GOOGLE_VISION_API_KEY=AIzaSyCXruhWvFo9Xu8EStNqaSm024ZyDxvn7Qo
    ports:
      - "8080:8080"
      - "8081:8081" 
    volumes:
      - ./Logs:/app/Logs
      - ./wwwroot/uploads:/app/wwwroot/uploads
      - ./https:/https:ro
    networks:
      - gighub-network
    depends_on:
      postgres:
        condition: service_healthy
      flask-ml-api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  gighub-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local